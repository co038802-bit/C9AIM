name: Build C9AIM APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: |
          mkdir extracted
          unzip -q C9AIM_Projeto_compilacao_online.zip -d extracted
          cd extracted/C9AIM
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/C9AIM-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: C9AIM-debug-apk
          path: C9AIM-debug.apk
